<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo: paper plane whose dotted trail draws a chat bubble">
  <defs>
    <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset=".6" stop-color="#9333ea"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="logo-w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#logo-g)"/>
  <!-- the flight path draws a chat bubble: sending turns into a conversation -->
  <path d="M300 112 H160 a62 62 0 0 0 -62 62 v104 a62 62 0 0 0 62 62 h18 v66 l76 -66 h96 a62 62 0 0 0 62 -62 v-40" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 34" opacity=".85"/>
  <!-- the plane -->
  <path d="M232 214 L436 104 L384 306 L346 246 Z" fill="url(#logo-w)"/>
  <path d="M346 246 L436 104 L304 230 Z" fill="#c4b5fd"/>
  <path d="M346 246 L436 104" stroke="#9333ea" stroke-width="6" stroke-linecap="round"/>
  <circle cx="190" cy="226" r="16" fill="#fbbf24"/>
</svg>
